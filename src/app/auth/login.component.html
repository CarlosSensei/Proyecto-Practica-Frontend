<div class="container">
    <form>
        <mat-form-field>
        <input
            matInput
            name="user"
            placeholder="User"
            [(ngModel)]="user">
        </mat-form-field>

        <mat-form-field>
        <input
            matInput
            name="password"
            type="password"
            placeholder="Password"
            [(ngModel)]="password">
        </mat-form-field>
    </form>
</div>
