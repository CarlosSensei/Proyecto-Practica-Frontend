<div class="container">
    <h1>Listado de Autores</h1>
    
    <table mat-table [dataSource]="dataSource"> 
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Identificador </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nombre autor  </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="nationality">
            <th mat-header-cell *matHeaderCellDef> Nacionalidad  </th>
            <td mat-cell *matCellDef="let element"> {{element.nationality}} </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
                @if(authService.isLogged()) {
                    <button mat-icon-button color="primary" (click)="editAuthor(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="accent" class="delete-button" (click)="deleteAuthor(element)">
                        <mat-icon>clear</mat-icon>
                    </button>
                }
            </td>
        </ng-container>
        
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table> 

    <mat-paginator (page)="loadPage($event)" [pageSizeOptions]="[5, 10, 20]" 
        [pageIndex]="pageNumber" [pageSize]="pageSize" 
        [length]="totalElements" showFirstLastButtons>
    </mat-paginator>

    @if(authService.isLogged()) {
        <div class="buttons">
            <button mat-flat-button color="primary" (click)="createAuthor()">Nuevo autor</button> 
        </div> 
    }
</div>
